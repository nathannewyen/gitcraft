# GoReleaser configuration for gitcraft
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/nathannewyen/gitcraft/cmd.Version={{.Version}}
      - -X github.com/nathannewyen/gitcraft/cmd.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

brews:
  - name: gitcraft
    repository:
      owner: nathannewyen
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/nathannewyen/gitcraft"
    description: "AI-powered git commit message generator"
    license: "MIT"
    install: |
      bin.install "gitcraft"
    test: |
      system "#{bin}/gitcraft", "--version"

release:
  github:
    owner: nathannewyen
    name: gitcraft
  draft: false
  prerelease: auto
